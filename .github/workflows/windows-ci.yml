name: windows-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Tests (V1 + FRAMED, incl. slow)
        run: python -m pytest -q
      - name: FRAMED pipeline smoke run
        shell: pwsh
        run: |
          python -m src.framed.run --stage fetch
          python -m src.framed.run --stage stats
          python -m src.framed.run --stage baselines --fast --models knn
          python -m src.framed.run --stage report
          if (-not (Test-Path reports/framed/index.html)) { exit 1 }
